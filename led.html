<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAKWON SHOWCASE — LED</title>
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stage.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="bg"></div>
    <div id="grade"></div>
    <div id="seamlight"></div>
    <div id="fogBack" class="fog"><i class="f-cold"></i><i class="f-red"></i><i class="f-ground"></i></div>
    <div id="beams"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
    <div id="lamps"><i class="l1"></i><i class="l2"></i></div>
    <div id="scenes"></div>
    <div id="popups"></div>
    <div id="fogFront" class="fog"><i class="f-wisp"></i><i class="f-smoke"></i><i class="f-gfront"></i></div>
    <canvas id="embers"></canvas>
    <div id="surge"><i></i></div>
    <div id="alarm"></div>
    <div id="flash"></div>
    <div id="beacon"><i class="bl"></i><i class="br"></i></div>
    <div id="sweep"></div>
    <div id="doors"><i class="dl"></i><i class="dr"></i><b></b></div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="guide"><div class="seam"></div><div class="safe a"></div><div class="safe b"></div><div class="lbl a">LEFT 6960 × 2160</div><div class="lbl b">RIGHT 6960 × 2160</div></div>
    <div id="blackout" class="on"></div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/sync.js"></script>
<script src="js/fx.js"></script>
<script src="js/stage.js"></script>
<script src="js/led.js"></script>
</body>
</html>
